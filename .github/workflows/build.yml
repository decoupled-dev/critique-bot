name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # every Monday: catches a new vulnerability in a pinned dependency

# A newer push to the same branch or pull request replaces the run in progress (never a release).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job may write (to create the release).
permissions:
  contents: read

# Every action is pinned to a full commit SHA (the tag it was resolved from is
# in the trailing comment). Every Python package comes from constraints.txt.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c constraints.txt -e .
      - name: Unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in the pinned dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r constraints.txt --no-deps --disable-pip
      - name: Python security lint
        run: |
          python -m pip install bandit==1.9.4
          bandit -q -c pyproject.toml -r src/critique_bot -ll

  bundle:
    needs: [test, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, tag: linux-x64, python_arch: x64, experimental: false }
          - { os: ubuntu-22.04-arm, tag: linux-arm64, python_arch: arm64, experimental: false }
          - { os: windows-2022, tag: windows-x64, python_arch: x64, experimental: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install package and PyInstaller
        run: python -m pip install -c constraints.txt -e ".[packaging]"

      - name: Build zip
        run: python scripts/build.py

      - name: Build .deb
        if: runner.os == 'Linux'
        run: |
          python scripts/build_deb.py
          dpkg-deb --info dist/critique-bot_*.deb
          dpkg-deb --contents dist/critique-bot_*.deb | head -20

      - name: Test the .deb installs and runs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/critique-bot_*.deb
          critique-bot --help > /dev/null
          crit --help > /dev/null
          systemctl cat critique-bot-worker.service | grep -q /etc/critique-bot/config.json
          getent passwd critique-bot

      - name: Test the .deb on a minimal image
        # Docker's Ubuntu image leaves out /usr/share/doc (like many server and cloud images).
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none -v "$PWD/dist:/dist:ro" ubuntu:22.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends /dist/critique-bot_*.deb
            dpkg -s critique-bot | grep -q "Status: install ok installed"
            test -f /etc/critique-bot/config.json
            useradd -m dev && su dev -c "crit --help >/dev/null && crit config >/dev/null"
          '

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critique-bot-${{ matrix.tag }}
          path: |
            dist/critique-bot-*.zip
            dist/critique-bot_*.deb
          if-no-files-found: error

  wheel:
    needs: [test, audit]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel
        env:
          # The isolated build env (setuptools) follows the same pins.
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          python -m pip install -c constraints.txt build
          python -m build --sdist --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critique-bot-python
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [bundle, wheel]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write      # signs the build provenance (Sigstore, keyless)
      attestations: write  # stores it with the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Install scripts
        # releases/latest/download/install.ps1 and install.sh: the one-line installers.
        run: |
          mkdir -p artifacts/installers
          cp source/scripts/install.ps1 source/scripts/install.sh artifacts/installers/
      - name: Checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's|  \./[^/]*/|  |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance
        # Lets anyone check a download came from this workflow:
        #   gh attestation verify critique-bot-<version>-linux-x64.zip --repo <owner>/critique-bot
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/install.ps1
            artifacts/**/install.sh
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/**/*
          generate_release_notes: true
