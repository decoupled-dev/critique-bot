name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # every Monday: catches a new vulnerability in a pinned dependency

# A newer push to the same branch or pull request replaces the run in progress (never a release).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job may write (to create the release).
permissions:
  contents: read

# Every action is pinned to a full commit SHA (the tag it was resolved from is
# in the trailing comment). Every Python package comes from constraints.txt.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[webchat]"
      - name: Unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests
      - name: Eval grader audit (every check fails untouched and passes with its reference)
        if: runner.os == 'Linux'
        run: python -m critique_bot.eval_harness audit
      - name: Core crit works without the web chat (critique_bot/webchat/ deleted)
        if: runner.os == 'Linux'
        env:
          PYTHONUTF8: "1"
        run: python scripts/check_webchat_removable.py

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in the pinned dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r constraints.txt --no-deps --disable-pip
      - name: Python security lint
        run: |
          python -m pip install bandit==1.9.4
          bandit -q -c pyproject.toml -r src/critique_bot -ll

  bundle:
    needs: [test, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, tag: linux-x64, python_arch: x64, experimental: false }
          - { os: ubuntu-22.04-arm, tag: linux-arm64, python_arch: arm64, experimental: false }
          - { os: windows-2022, tag: windows-x64, python_arch: x64, experimental: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install package and PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -c constraints.txt -e ".[packaging]"

      - name: Build zip (Windows)
        if: runner.os == 'Windows'
        run: python scripts/build.py

      - name: Build zip and .deb on Debian 11 (Linux)
        # Built against glibc 2.31 (Debian 11), so the program runs on Ubuntu 20.04+ and
        # Debian 11+: a PyInstaller bundle needs the glibc it was built with, or newer.
        # The image is pinned by digest (covers x64 and arm64).
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -v "$PWD:/w" -w /w \
            python:3.12-slim-bullseye@sha256:411fa4dcfdce7e7a3057c45662beba9dcd4fa36b2e50a2bfcd6c9333e59bf0db \
            bash -euc '
              apt-get update -qq && apt-get install -y -qq binutils >/dev/null
              git config --global --add safe.directory /w 2>/dev/null || true
              python -m pip install -q --root-user-action=ignore -c constraints.txt -e ".[packaging]"
              python scripts/build.py
              python scripts/build_deb.py
            '
          sudo chown -R "$(id -u):$(id -g)" dist build
          dpkg-deb --info dist/crit_*.deb
          dpkg-deb --contents dist/crit_*.deb | head -20

      - name: Test the .deb installs and runs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/crit_*.deb
          crit --help > /dev/null
          crit review --help > /dev/null
          test ! -e /usr/bin/critique-bot
          systemctl cat crit-worker.service | grep -q /etc/crit/config.json
          getent passwd crit
          dpkg -s crit | grep -q "Status: install ok installed"
          # crit uninstall removes the user's files without a question and names the apt command.
          crit uninstall </dev/null | grep -qx "Run: sudo apt purge crit"

      - name: Test the .deb on Ubuntu 20.04 (oldest supported)
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none -v "$PWD/dist:/dist:ro" ubuntu:20.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends /dist/crit_*.deb
            dpkg -s crit | grep -q "Status: install ok installed"
            useradd -m dev && su dev -c "crit --help >/dev/null && crit config >/dev/null"
          '

      - name: Test the .deb on a minimal image
        # Docker's Ubuntu image leaves out /usr/share/doc (like many server and cloud images).
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none -v "$PWD/dist:/dist:ro" ubuntu:22.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends /dist/crit_*.deb
            dpkg -s crit | grep -q "Status: install ok installed"
            test -f /etc/crit/config.json
            useradd -m dev && su dev -c "crit --help >/dev/null && crit config >/dev/null"
          '

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crit-${{ matrix.tag }}
          path: |
            dist/crit-*.zip
            dist/crit_*.deb
          if-no-files-found: error

  wheel:
    needs: [test, audit]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel
        env:
          # The isolated build env (setuptools) follows the same pins.
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          python -m pip install -c constraints.txt build
          python -m build --sdist --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crit-python
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [bundle, wheel]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write      # signs the build provenance (Sigstore, keyless)
      attestations: write  # stores it with the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Install scripts
        # releases/latest/download/install.ps1 and install.sh: the one-line installers.
        run: |
          mkdir -p artifacts/installers
          cp source/scripts/install.ps1 source/scripts/install.sh artifacts/installers/
      - name: Checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's|  \./[^/]*/|  |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance
        # Lets anyone check a download came from this workflow:
        #   gh attestation verify crit-<version>-linux-x64.zip --repo decoupled-dev/critique-bot
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/**/crit-*.zip
            artifacts/**/crit_*.deb
            artifacts/**/install.ps1
            artifacts/**/install.sh
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
