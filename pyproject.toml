[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critique-bot"
version = "0.1.0"
description = "Headless Microsoft Edge bot that submits a patch to a web LLM and captures the review."
requires-python = ">=3.10"
dependencies = ["playwright>=1.49.0"]

[project.scripts]
critique-bot = "critique_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
