[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logcritique"
version = "0.1.0"
description = "LogCritique — offline audit of Android Java and Kotlin log calls."
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-kotlin>=1.0",
    "javalang>=0.13",
]

[project.scripts]
logcritique = "log_analyzer.analyze:main"

[tool.setuptools.packages.find]
include = ["log_analyzer*"]

[tool.setuptools.package-data]
log_analyzer = ["templates/*.html"]
