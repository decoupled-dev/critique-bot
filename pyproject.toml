[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critique-bot"
version = "0.1.0"
description = "Patch review bot that drives a web chat UI in Microsoft Edge."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
critique-bot = "critique_bot.cli:main"
crit = "critique_bot.agent_cli:main"
bot-agent = "critique_bot.agent_cli:main"

[project.optional-dependencies]
packaging = ["pyinstaller>=6.11"]
index = [
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree-sitter-kotlin",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
critique_bot = ["prompts/*.txt"]
