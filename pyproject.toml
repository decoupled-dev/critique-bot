[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critique-bot"
version = "1.0.7"
description = "crit: coding agent and code reviewer that drives a web chat UI in Microsoft Edge or a local model."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# The web-chat backend (critique_bot.webchat) needs Playwright: the [webchat] extra.
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
crit = "critique_bot.agent_cli:main"
# Hidden compatibility names for pip installs of 1.0.4 and earlier (not documented).
critique-bot = "critique_bot.cli:main"
bot-agent = "critique_bot.agent_cli:main"

[project.optional-dependencies]
webchat = ["playwright>=1.49.0"]
packaging = ["pyinstaller>=6.11", "playwright>=1.49.0"]
index = [
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-java",
    "tree-sitter-kotlin",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
critique_bot = ["prompts/*.txt", "skills/*/SKILL.md"]

[tool.bandit]
# Reviewed false positives (see docs/security.md, "Scans"):
#   B604: crit's own functions take a shell *object* as `shell=`; running commands is the agent's job.
#         subprocess(..., shell=True) is still caught by B602.
#   B101: asserts narrow types for the type checker; they are not security checks.
#   B110/B112: deliberate best-effort cleanup (closing tabs, removing temp files) that must not raise.
skips = ["B604", "B101", "B110", "B112"]
exclude_dirs = ["tests"]
