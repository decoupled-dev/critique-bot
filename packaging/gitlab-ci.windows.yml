# Copy this file into the GitLab project as .gitlab-ci.yml when the
# critique-bot runner is Windows (shell executor → PowerShell).
# Linux bash template: .gitlab-ci.yml at the repo root.
#
# PowerShell (do not convert $CRITIQUE_BIN to $env:CRITIQUE_BIN):
#   - GitLab expands $VAR before PowerShell runs. $env:FOO is read as
#     CI variable "env", so `$env:CRITIQUE_BIN submit` becomes
#     `:CRITIQUE_BIN submit` and PowerShell tries to run `submit`.
#   - Invoke a path stored in a variable with &:
#       & "$CRITIQUE_BIN" submit ...
#     GitLab expands $CRITIQUE_BIN first; PowerShell then runs that exe.
#   - A literal PowerShell $ must be written $$ (GitLab turns $$ into $).
#
# Pipelines:
#   - Merge requests: the review job runs automatically.
#   - Branch / main pushes: a manual "review" job is created (click Play).
# Pushing to main alone does not auto-run review.
#
# Runner PC requirements:
#   - A project or group runner tagged `critique-bot` (shell executor, not Docker)
#     so the job sees the same queue directory as the long-running worker.
#   - Microsoft Edge or Google Chrome, signed in once (`critique-bot worker --headed`
#     or one-shot `--headed`).
#   - Worker already running: packaging/worker-start.ps1 at logon or a scheduled task.
#   - `critique-bot` on the runner user's PATH (worker-start.ps1 adds it),
#     and config.json on a shared path. Edit the two `variables:` lines
#     in this file — do not set CRITIQUE_BIN / CRITIQUE_CONFIG in GitLab
#     Settings → CI/CD → Variables. If PATH is not an option, set
#     CRITIQUE_BIN to the full path of critique-bot.exe here.
#
# Inline + summary comments need a project (or group) access token:
#   1. Settings → Access Tokens → project access token
#      Role: Developer (or higher). Scope: api.
#   2. Settings → CI/CD → Variables → CRITIQUE_GITLAB_TOKEN
#      Masked: yes. Protect variable: no (so feature-branch MRs can post).
# CI_JOB_TOKEN cannot create MR notes or inline discussions.
#
# Several MRs can trigger this job at once. They enqueue and wait; the
# worker serializes Edge and applies min_interval_seconds from config.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - review

variables:
  # Job YAML only (not GitLab CI/CD variables). BIN is looked up on PATH;
  # CONFIG must be the same file the worker uses. Edit if your install is
  # not C:\critique-bot (pip/venv: ...\critique-bot\config.json).
  CRITIQUE_BIN: critique-bot
  CRITIQUE_CONFIG: 'C:\critique-bot\config.json'

review:
  stage: review
  interruptible: true
  tags:
    - critique-bot
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
      when: manual
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - out/
      - diff.patch
  script:
    - |
      & "$CRITIQUE_BIN" submit --config "$CRITIQUE_CONFIG" --output-dir out --wait-timeout 1800
      if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      if ("$CI_MERGE_REQUEST_IID" -and (Test-Path out\review.md)) {
        & "$CRITIQUE_BIN" gitlab-post --review-file out\review.md --patch-file diff.patch
        if ($$LASTEXITCODE -ne 0) {
          Write-Host "review artifact saved; could not post GitLab comments (set CRITIQUE_GITLAB_TOKEN)"
        }
      }
