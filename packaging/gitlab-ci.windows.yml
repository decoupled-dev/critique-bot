# Copy this file into the GitLab project as .gitlab-ci.yml when the
# crit runner is Windows (shell executor → PowerShell).
# Linux bash template: .gitlab-ci.yml at the repo root.
# Full setup: docs/gitlab-ci.md
#
# This job does not talk to Edge. It only:
#   1. submit  — build the MR diff, enqueue, wait for out/review.md
#   2. gitlab-post — turn that review into MR summary + inline comments
# The long-running worker on this PC owns the signed-in browser.
#
# Original files. Do not add --patch-file or --file here.
# submit (no --patch-file) owns the checkout work:
#   git fetch origin $CI_MERGE_REQUEST_DIFF_BASE_SHA (deepen target if needed)
#   git diff $CI_MERGE_REQUEST_DIFF_BASE_SHA $CI_COMMIT_SHA
#   writes diff.patch, reads HEAD contents of every changed text file
#   (markdown/RST and binaries skipped; deleted paths skipped), then
#   enqueues the job:
#     - Small MR: template + files + patch fit in max_prompt_chars
#       (default 120000) → one prompt on the job.
#     - Larger MR: original files are staged on the job (one body each,
#       cap max_files, default 80) plus the review prompt/patch.
# The worker is chat-only: it pastes whatever submit queued (one paste,
# or prime + each staged file + review). File-by-file reviews take
# longer; this job waits 30 minutes (--wait-timeout 1800) and times out at 1h.
#
# PowerShell (do not convert $CRIT_BIN to $env:CRIT_BIN):
#   - GitLab expands $VAR before PowerShell runs. $env:FOO is read as
#     CI variable "env", so `$env:CRIT_BIN submit` becomes
#     `:CRIT_BIN submit` and PowerShell tries to run `submit`.
#   - Invoke a path stored in a variable with &:
#       & "$CRIT_BIN" submit ...
#     GitLab expands $CRIT_BIN first; PowerShell then runs that exe.
#   - A literal PowerShell $ must be written $$ (GitLab turns $$ into $).
#
# Pipelines:
#   - Merge requests: the review job runs automatically.
#   - Branch / main pushes: a manual "review" job is created (click Play).
# Pushing to main alone does not auto-run review.
#
# Runner PC requirements:
#   - A project or group runner tagged `crit` (shell executor, not Docker)
#     so the job sees the same queue directory as the long-running worker.
#   - Microsoft Edge or Google Chrome, signed in once (`crit worker --headed`
#     or one-shot `--headed`).
#   - Worker already running: packaging/worker-start.ps1 at logon or a scheduled task.
#   - CRIT_BIN set to the full path of crit.exe (or on the system
#     PATH, admin-writable only), and config.json on a shared path. Edit the two `variables:` lines
#     in this file — do not set CRIT_BIN / CRIT_CONFIG in GitLab
#     Settings → CI/CD → Variables. If PATH is not an option, set
#     CRIT_BIN to the full path of crit.exe here.
#
# Security: the worker runs as its OWN OS user (not the runner user). This job
# runs whatever a branch's .gitlab-ci.yml says, as the runner user; it must not
# be able to read the worker's browser profile (SSO cookies). The runner user is
# only in the worker's queue group: it may write inbox/ and read results/.
# Register the runner for this project only; see DEPLOY.md "Separate the worker from CI".
#
# Inline + summary comments need a project access token:
#   1. Settings → Access Tokens → project access token
#      Role: Reporter (lowest that can read the diff and post discussions).
#      Scope: api. Set an expiry.
#   2. Settings → CI/CD → Variables → CRIT_GITLAB_TOKEN
#      Masked: yes. Protected: yes if reviewed MRs come from protected branches.
#      Unprotected (needed for feature-branch MRs) means anyone who can push a
#      branch can read it, so keep it Reporter-only and rotate it.
# CI_JOB_TOKEN cannot create MR notes or inline discussions.
#
# Several MRs can trigger this job at once. They enqueue and wait; the
# worker serializes Edge and applies min_interval_seconds from config.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - review

variables:
  # Job YAML only (not GitLab CI/CD variables). BIN is looked up on PATH;
  # CONFIG must be the same file the worker uses. Edit if your install is
  # not C:\crit (pip/venv: ...\crit\config.json).
  CRIT_BIN: crit.exe
  CRIT_CONFIG: 'C:\crit\config.json'
  # Belt and suspenders: the CLI also forces UTF-8 on stdout/stderr.
  # Without this, a Windows charmap codec can crash print() on U+2011.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

review:
  stage: review
  interruptible: true
  tags:
    - crit
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
      when: manual
  # Only the review leaves the runner as an artifact. The prompt, the chat page snapshot of a
  # failed job, and the patch stay in the worker's queue folder on this PC.
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - out/review.md
      - out/review.json
      - out/status.json
  script:
    - |
      & "$CRIT_BIN" submit --config "$CRIT_CONFIG" --output-dir out --wait-timeout 1800
      if ($$LASTEXITCODE -ne 0) { exit $$LASTEXITCODE }
      if ("$CI_MERGE_REQUEST_IID" -and (Test-Path out\review.md)) {
        & "$CRIT_BIN" gitlab-post --review-file out\review.md --patch-file diff.patch
        if ($$LASTEXITCODE -ne 0) {
          Write-Host "review artifact saved; could not post GitLab comments (set CRIT_GITLAB_TOKEN)"
        }
      }
