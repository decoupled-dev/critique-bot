# Copy this file (or the `review` job) into the GitLab project that should
# post critique-bot comments on merge requests.
#
# Linux bash (this file). Windows PowerShell: packaging/gitlab-ci.windows.yml
# Do not rewrite $CRITIQUE_BIN as $env:CRITIQUE_BIN — see that file.
#
# Pipelines:
#   - Merge requests: the review job runs automatically.
#   - Branch / main pushes: a manual "review" job is created (click Play).
# Pushing to main alone does not auto-run review.
#
# Runner PC requirements:
#   - A project or group runner tagged `critique-bot` (shell executor, not Docker)
#     so the job sees the same queue directory as the long-running worker.
#   - Microsoft Edge or Google Chrome, signed in once (`critique-bot worker --headed`
#     or one-shot `--headed`).
#   - Worker already running, e.g. systemd --user
#     ~/.config/systemd/user/critique-bot-worker.service
#     or packaging/critique-bot-worker.service / packaging/worker-start.ps1
#   - critique-bot on PATH, config.json on a shared path.
#
# Inline + summary comments need a project (or group) access token:
#   1. Settings → Access Tokens → project access token
#      Role: Developer (or higher). Scope: api.
#   2. Settings → CI/CD → Variables → CRITIQUE_GITLAB_TOKEN
#      Masked: yes. Protect variable: no (so feature-branch MRs can post).
# CI_JOB_TOKEN cannot create MR notes or inline discussions.
#
# Several MRs can trigger this job at once. They enqueue and wait; the
# worker serializes Edge and applies min_interval_seconds from config.
# submit builds diff.patch from the job checkout and attaches changed files.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - review

variables:
  CRITIQUE_CONFIG: /opt/critique-bot/config.json
  CRITIQUE_BIN: critique-bot

review:
  stage: review
  interruptible: true
  tags:
    - critique-bot
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
      when: manual
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - out/
      - diff.patch
  script:
    - $CRITIQUE_BIN submit --config "$CRITIQUE_CONFIG" --output-dir out --wait-timeout 1800
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -f out/review.md ]; then
        $CRITIQUE_BIN gitlab-post \
          --review-file out/review.md \
          --patch-file diff.patch \
          || echo "review artifact saved; could not post GitLab comments (set CRITIQUE_GITLAB_TOKEN)"
      fi
