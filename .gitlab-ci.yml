# Copy this file (or the `review` job) into the GitLab project that should
# post critique-bot comments on merge requests.
#
# Linux bash (this file). Windows PowerShell: packaging/gitlab-ci.windows.yml
# Do not rewrite $CRITIQUE_BIN as $env:CRITIQUE_BIN — see that file.
#
# Pipelines:
#   - Merge requests: the review job runs automatically.
#   - Branch / main pushes: a manual "review" job is created (click Play).
# Pushing to main alone does not auto-run review.
#
# Runner PC requirements:
#   - A project or group runner tagged `critique-bot` (shell executor, not Docker)
#     so the job sees the same queue directory as the long-running worker.
#   - Microsoft Edge or Google Chrome, signed in once (`critique-bot worker --headed`
#     or one-shot `--headed`).
#   - Worker already running as user critique-bot:
#     packaging/critique-bot-worker.service / packaging/worker-start.ps1
#   - critique-bot on PATH, config.json on a shared path.
#
# Security: the worker runs as its OWN OS user (not the runner user). This job
# runs whatever a branch's .gitlab-ci.yml says, as the runner user; it must not
# be able to read the worker's browser profile (SSO cookies). The runner user is
# only in the worker's queue group: it may write inbox/ and read results/.
# Register the runner for this project only; see DEPLOY.md "Separate the worker from CI".
#
# Inline + summary comments need a project access token:
#   1. Settings → Access Tokens → project access token
#      Role: Reporter (lowest that can read the diff and post discussions).
#      Scope: api. Set an expiry.
#   2. Settings → CI/CD → Variables → CRITIQUE_GITLAB_TOKEN
#      Masked: yes. Protected: yes if reviewed MRs come from protected branches.
#      Unprotected (needed for feature-branch MRs) means anyone who can push a
#      branch can read it, so keep it Reporter-only and rotate it.
# CI_JOB_TOKEN cannot create MR notes or inline discussions.
#
# Several MRs can trigger this job at once. They enqueue and wait; the
# worker serializes Edge and applies min_interval_seconds from config.
# submit builds diff.patch from the job checkout, loads original file
# bodies, and enqueues them (one ordered paste, or instructions + files + patch).
# The worker is chat-only: it pastes that job. See docs/gitlab-ci.md.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - review

variables:
  CRITIQUE_CONFIG: /opt/critique-bot/config.json
  CRITIQUE_BIN: critique-bot

review:
  stage: review
  interruptible: true
  tags:
    - critique-bot
  timeout: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
      when: manual
  # Only the review leaves the runner as an artifact. The prompt, the chat page snapshot of a
  # failed job, and the patch stay in the worker's queue folder on this PC.
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - out/review.md
      - out/review.json
      - out/status.json
  script:
    - $CRITIQUE_BIN submit --config "$CRITIQUE_CONFIG" --output-dir out --wait-timeout 1800
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -f out/review.md ]; then
        $CRITIQUE_BIN gitlab-post \
          --review-file out/review.md \
          --patch-file diff.patch \
          || echo "review artifact saved; could not post GitLab comments (set CRITIQUE_GITLAB_TOKEN)"
      fi
