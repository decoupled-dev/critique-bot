<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Log Analyzer</title>
  <style>
    :root {
      --page: #eef1f5;
      --card: #ffffff;
      --ink: #152033;
      --ink-2: #3d4d63;
      --ink-3: #6b7c90;
      --line: #d5dde6;
      --line-2: #e7edf3;
      --brand: #12325a;
      --accent: #0b63ce;
      --accent-soft: #e7f1fb;
      --v: #5b6b7c;
      --d: #0b63ce;
      --i: #1a7f4b;
      --w: #9a6b00;
      --e: #b42318;
      --wtf: #7a3db3;
      --print: #b45309;
      --loop: #9d174d;
      --observer: #0e7490;
      --listener: #3f6212;
      --hot: #9f1239;
      --sans: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 var(--sans); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    header.app {
      background: var(--brand);
      color: #fff;
      padding: 20px 28px 18px;
    }
    header.app .title-row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    header.app h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .copy-ai { background: #fff; color: var(--brand); border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; }
    header.app .sub { margin: 6px 0 16px; color: #c9d6e6; font-size: 13px; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px; }
    .stat {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      min-width: 110px;
      padding: 10px 12px;
    }
    .stat b { display: block; font-size: 22px; line-height: 1.1; }
    .stat span { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #c9d6e6; }
    .stat.primary { background: #fff; color: var(--brand); }
    .stat.primary span { color: #5b6b7c; }
    .layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 148px); }
    aside {
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 16px 14px 24px;
      overflow: auto;
    }
    .aside-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .aside-head h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
    .aside-head span { font-size: 12px; color: var(--ink-3); }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #f8fafc;
      color: var(--ink);
    }
    .search:focus { outline: 2px solid #9cc3f0; border-color: var(--accent); }
    .file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .file-btn, .all-btn {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 8px;
      color: inherit;
    }
    .all-btn { grid-template-columns: 1fr auto; font-weight: 650; }
    .file-btn:hover, .all-btn:hover { background: var(--accent-soft); }
    .file-btn.active, .all-btn.active { background: var(--accent-soft); border-color: #b9d4f3; }
    .rank { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .file-name { font-weight: 650; font-size: 13px; }
    .file-path { display: block; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-count { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--brand); }
    .bar { grid-column: 2 / -1; height: 4px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--accent); }
    main { padding: 18px 22px 40px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
    .panel h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-label { width: 88px; flex: 0 0 88px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
    .chip {
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 650;
    }
    .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chip.v.on { background: var(--v); border-color: var(--v); }
    .chip.d.on { background: var(--d); border-color: var(--d); }
    .chip.i.on { background: var(--i); border-color: var(--i); }
    .chip.w.on { background: var(--w); border-color: var(--w); }
    .chip.e.on { background: var(--e); border-color: var(--e); }
    .chip.wtf.on { background: var(--wtf); border-color: var(--wtf); }
    .chip.println.on, .chip.print.on { background: var(--print); border-color: var(--print); }
    .chip.loop.on { background: var(--loop); border-color: var(--loop); }
    .chip.observer.on { background: var(--observer); border-color: var(--observer); }
    .chip.listener.on { background: var(--listener); border-color: var(--listener); }
    .chip.hot_path.on { background: var(--hot); border-color: var(--hot); }
    .ghost { margin-left: auto; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--ink-2); }
    .result-meta { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 12px; color: var(--ink-2); font-size: 13px; }
    .file-group { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
    .file-group > h3 {
      margin: 0;
      padding: 14px 16px;
      background: #f6f8fb;
      border-bottom: 1px solid var(--line);
      font-size: 18px;
      font-weight: 750;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .file-group > h3 small { font-weight: 600; color: var(--ink-3); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line-2); }
    th { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); background: #fafcfe; }
    tr.call { cursor: pointer; }
    tr.call:hover td { background: #f5f9ff; }
    tr.call.open td { background: #eef5ff; }
    .lvl {
      display: inline-block; min-width: 64px; text-align: center;
      border-radius: 6px; font: 700 11px/1.6 var(--mono); color: #fff;
    }
    .lvl.v { background: var(--v); } .lvl.d { background: var(--d); }
    .lvl.i { background: var(--i); } .lvl.w { background: var(--w); }
    .lvl.e { background: var(--e); } .lvl.wtf { background: var(--wtf); }
    .lvl.println, .lvl.print { background: var(--print); }
    .score { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--brand); }
    .where { font-weight: 650; }
    .snippet { font-family: var(--mono); font-size: 12px; color: #1e3a5f; }
    .why { margin-top: 4px; color: var(--ink-2); font-size: 12px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin: 3px 4px 0 0; background: #eef2f6; color: var(--ink-2); }
    .badge.loop { background: #fce7f3; color: var(--loop); }
    .badge.observer { background: #cffafe; color: var(--observer); }
    .badge.listener { background: #ecfccb; color: var(--listener); }
    .badge.hot_path { background: #ffe4e6; color: var(--hot); }
    .detail {
      margin: 0 12px 12px;
      padding: 12px 14px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      font: 12px/1.5 var(--mono);
      white-space: pre-wrap;
    }
    .pager { display: flex; justify-content: flex-end; gap: 8px; align-items: center; color: var(--ink-2); }
    .pager button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
    .empty { padding: 36px; text-align: center; color: var(--ink-3); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }
    .errors { margin-top: 16px; color: var(--e); font-size: 13px; }
    .line { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12px; }
  </style>
</head>
<body>
  <header class="app">
    <div class="title-row">
      <div>
        <h1>Android Log Analyzer</h1>
        <p class="sub" id="subtitle">Offline scan of Java and Kotlin sources</p>
      </div>
      <button type="button" class="copy-ai" id="copyAi">Copy investigation JSON for AI</button>
    </div>
    <div class="summary" id="kpis"></div>
  </header>
  <div class="layout">
    <aside>
      <div class="aside-head">
        <h2>Files by log count</h2>
        <span>most → least</span>
      </div>
      <input class="search" id="fileSearch" placeholder="Filter file names" aria-label="Filter file names">
      <div class="file-list" id="tree"></div>
    </aside>
    <main>
      <section class="panel">
        <h2>Filters</h2>
        <div class="filter-row">
          <span class="filter-label">Search</span>
          <input class="search" id="findingSearch" placeholder="Function, snippet, path, or why noisy" aria-label="Search findings" style="max-width:420px">
        </div>
        <div class="filter-row" id="levelFilters">
          <span class="filter-label">Log level</span>
        </div>
        <div class="filter-row" id="contextFilters">
          <span class="filter-label">Location</span>
        </div>
        <div class="filter-row">
          <span class="filter-label">Focus</span>
          <button type="button" class="chip" id="chattyBtn">High frequency only</button>
          <button type="button" class="ghost" id="clearBtn">Clear filters</button>
        </div>
      </section>
      <div class="result-meta">
        <div id="pageInfo"></div>
        <div class="pager">
          <button id="prevPage" type="button">Previous</button>
          <button id="nextPage" type="button">Next</button>
        </div>
      </div>
      <div id="groups"></div>
      <div class="empty" id="empty" hidden>No log calls match the current filters.</div>
      <div class="errors" id="errors"></div>
    </main>
  </div>
  <script id="log-analyzer-data" type="application/json"><<<LOG_ANALYZER_JSON>>></script>
  <script>
    const DATA = JSON.parse(document.getElementById("log-analyzer-data").textContent);
    const PAGE = 60;
    const state = {
      levels: new Set(),
      contexts: new Set(),
      chattyOnly: false,
      file: "",
      fileQuery: "",
      query: "",
      page: 0,
      open: null,
    };
    const levelOrder = ["v","d","i","w","e","wtf","println","print"];
    const contextOrder = ["loop","observer","listener","hot_path"];
    const contextLabel = { loop: "Loop", observer: "Observer", listener: "Listener", hot_path: "Hot path" };
    const fileCount = Object.fromEntries(DATA.files.map((f) => [f.path, f.count]));
    const maxCount = Math.max(1, ...DATA.files.map((f) => f.count));

    function $(id) { return document.getElementById(id); }

    function renderKpis() {
      const s = DATA.stats;
      const items = [
        ["Log calls", s.findings, true],
        ["Files with logs", s.files_with_findings, true],
        ["High frequency", s.high_freq, true],
        ["Verbose", s.by_level.v || 0, false],
        ["Debug", s.by_level.d || 0, false],
        ["Info", s.by_level.i || 0, false],
        ["Warn", s.by_level.w || 0, false],
        ["Error", s.by_level.e || 0, false],
      ];
      $("kpis").innerHTML = items.map(([label, value, primary]) =>
        `<div class="stat ${primary ? "primary" : ""}"><b>${value}</b><span>${label}</span></div>`
      ).join("");
      $("subtitle").textContent = `${DATA.root}  ·  ${DATA.generated_at}`;
    }

    function rankedFiles() {
      const q = state.fileQuery.toLowerCase();
      return DATA.files.filter((f) => !q || f.path.toLowerCase().includes(q));
    }

    function renderTree() {
      const files = rankedFiles();
      const allCount = DATA.stats.findings;
      let html = `<button class="all-btn ${state.file ? "" : "active"}" data-file="">
        <span>All files</span><span class="file-count">${allCount}</span></button>`;
      files.forEach((file, index) => {
        const active = state.file === file.path ? "active" : "";
        const width = Math.max(8, Math.round((file.count / maxCount) * 100));
        html += `<button class="file-btn ${active}" data-file="${escapeAttr(file.path)}">
          <span class="rank">${index + 1}</span>
          <span><span class="file-name">${escapeHtml(file.path.split("/").pop())}</span>
            <span class="file-path">${escapeHtml(file.path)}</span></span>
          <span class="file-count">${file.count}</span>
          <span class="bar"><i style="width:${width}%"></i></span>
        </button>`;
      });
      $("tree").innerHTML = html;
      $("tree").querySelectorAll("[data-file]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.file = btn.getAttribute("data-file") || "";
          state.page = 0;
          renderTree();
          renderRows();
        });
      });
    }

    function renderFilters() {
      $("levelFilters").innerHTML = `<span class="filter-label">Log level</span>` +
        levelOrder.filter((level) => DATA.stats.by_level[level]).map((level) =>
          `<button type="button" class="chip ${level}" data-kind="level" data-value="${level}">${level.toUpperCase()} ${DATA.stats.by_level[level]}</button>`
        ).join("");
      $("contextFilters").innerHTML = `<span class="filter-label">Location</span>` +
        contextOrder.map((ctx) =>
          `<button type="button" class="chip ${ctx}" data-kind="context" data-value="${ctx}">${contextLabel[ctx]} ${DATA.stats.by_context[ctx] || 0}</button>`
        ).join("");
    }

    function toggleSet(set, value) {
      if (set.has(value)) set.delete(value);
      else set.add(value);
    }

    function syncChips() {
      document.querySelectorAll(".chip[data-kind]").forEach((btn) => {
        const on = btn.dataset.kind === "level"
          ? state.levels.has(btn.dataset.value)
          : state.contexts.has(btn.dataset.value);
        btn.classList.toggle("on", on);
      });
      $("chattyBtn").classList.toggle("on", state.chattyOnly);
    }

    function filtered() {
      return DATA.findings.filter((f) => {
        if (state.file && f.file !== state.file) return false;
        if (state.levels.size && !state.levels.has(f.level)) return false;
        if (state.contexts.size && !f.contexts.some((c) => state.contexts.has(c))) return false;
        if (state.chattyOnly && !(f.contexts.length || f.chatty_score >= 6)) return false;
        if (state.query) {
          const blob = `${f.file} ${f.snippet} ${f.enclosing_function} ${f.enclosing_class} ${f.why} ${f.api}`.toLowerCase();
          if (!blob.includes(state.query.toLowerCase())) return false;
        }
        return true;
      }).sort((a, b) => {
        const ca = fileCount[a.file] || 0;
        const cb = fileCount[b.file] || 0;
        if (cb !== ca) return cb - ca;
        if (b.chatty_score !== a.chatty_score) return b.chatty_score - a.chatty_score;
        return a.line - b.line;
      });
    }

    function badges(finding) {
      return (finding.contexts || []).map((c) => `<span class="badge ${c}">${contextLabel[c] || c}</span>`).join("");
    }

    function renderRows() {
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / PAGE));
      if (state.page >= pages) state.page = pages - 1;
      const slice = rows.slice(state.page * PAGE, (state.page + 1) * PAGE);
      $("empty").hidden = rows.length > 0;
      const groups = [];
      let current = null;
      slice.forEach((f) => {
        if (!current || current.path !== f.file) {
          current = { path: f.file, items: [] };
          groups.push(current);
        }
        current.items.push(f);
      });
      $("groups").innerHTML = groups.map((group) => {
        const name = group.path.split("/").pop();
        const total = fileCount[group.path] || group.items.length;
        const body = group.items.map((f) => {
          const key = `${f.file}:${f.line}:${f.column}:${f.method}`;
          const open = state.open === key;
          return `<tr class="call ${open ? "open" : ""}" data-key="${escapeAttr(key)}">
            <td class="score">${f.chatty_score}</td>
            <td><span class="lvl ${f.level}">${f.level.toUpperCase()}</span></td>
            <td class="line">L${f.line}</td>
            <td><div class="where">${escapeHtml(f.enclosing_class || "—")}${f.enclosing_function ? "." + escapeHtml(f.enclosing_function) : ""}</div>${badges(f)}</td>
            <td><div class="snippet">${escapeHtml(f.snippet)}</div><div class="why">${escapeHtml(f.why)}</div></td>
          </tr>${open ? `<tr><td colspan="5"><div class="detail">${escapeHtml(detailText(f))}</div></td></tr>` : ""}`;
        }).join("");
        return `<section class="file-group">
          <h3>${escapeHtml(name)} <small>${escapeHtml(group.path)} · ${total} logs in file</small></h3>
          <table>
            <thead><tr><th>Score</th><th>Level</th><th>Line</th><th>Where</th><th>Call</th></tr></thead>
            <tbody>${body}</tbody>
          </table>
        </section>`;
      }).join("");
      $("groups").querySelectorAll("tr.call").forEach((tr) => {
        tr.addEventListener("click", () => {
          state.open = state.open === tr.dataset.key ? null : tr.dataset.key;
          renderRows();
        });
      });
      $("pageInfo").textContent = `${rows.length} matching calls · page ${state.page + 1} of ${pages}`;
      $("prevPage").disabled = state.page <= 0;
      $("nextPage").disabled = state.page >= pages - 1;
      if (DATA.errors && DATA.errors.length) {
        $("errors").innerHTML = DATA.errors.map((e) => `${e.file}: ${e.error}`).join("<br>");
      }
      syncChips();
    }

    function detailText(f) {
      return [
        `${f.api}.${f.method}`,
        `Receiver: ${f.receiver || "(none)"}`,
        `Location: ${f.file}:${f.line}:${f.column}`,
        `Function: ${f.enclosing_class || "?"}.${f.enclosing_function || "?"}`,
        `Contexts: ${(f.contexts || []).join(", ") || "none"}`,
        `Context evidence:`,
        ...((f.context_reasons || []).length ? f.context_reasons.map((r) => `  - ${r}`) : ["  (none — not inside a loop/observer/listener)"]),
        `AST ancestors: ${(f.ancestors || []).join(" → ") || "n/a"}`,
        `Parsers: ${(f.parse_sources || []).join(", ")}`,
        `Why noisy: ${f.why}`,
        "",
        "Source window (`>` is the log call):",
        f.source_window || f.snippet,
      ].join("\n");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, "&quot;");
    }

    function applyFilterChange() {
      state.page = 0;
      renderRows();
    }

    $("levelFilters").addEventListener("click", (ev) => {
      const btn = ev.target.closest(".chip");
      if (!btn) return;
      toggleSet(state.levels, btn.dataset.value);
      applyFilterChange();
    });
    $("contextFilters").addEventListener("click", (ev) => {
      const btn = ev.target.closest(".chip");
      if (!btn) return;
      toggleSet(state.contexts, btn.dataset.value);
      applyFilterChange();
    });
    $("chattyBtn").addEventListener("click", () => {
      state.chattyOnly = !state.chattyOnly;
      applyFilterChange();
    });
    $("clearBtn").addEventListener("click", () => {
      state.levels.clear();
      state.contexts.clear();
      state.chattyOnly = false;
      state.file = "";
      state.query = "";
      state.fileQuery = "";
      $("findingSearch").value = "";
      $("fileSearch").value = "";
      renderTree();
      applyFilterChange();
    });
    $("prevPage").addEventListener("click", () => { state.page -= 1; renderRows(); });
    $("nextPage").addEventListener("click", () => { state.page += 1; renderRows(); });
    $("fileSearch").addEventListener("input", (ev) => {
      state.fileQuery = ev.target.value;
      renderTree();
    });
    $("findingSearch").addEventListener("input", (ev) => {
      state.query = ev.target.value;
      applyFilterChange();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "/" && document.activeElement.tagName !== "INPUT") {
        ev.preventDefault();
        $("findingSearch").focus();
      }
      if (ev.key === "Escape") {
        state.open = null;
        renderRows();
      }
    });

    $("copyAi").addEventListener("click", async () => {
      const text = JSON.stringify(DATA, null, 2);
      try {
        await navigator.clipboard.writeText(text);
        $("copyAi").textContent = "Copied — paste into an AI chat";
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        $("copyAi").textContent = "Copied — paste into an AI chat";
      }
      setTimeout(() => { $("copyAi").textContent = "Copy investigation JSON for AI"; }, 2000);
    });

    renderKpis();
    renderFilters();
    renderTree();
    renderRows();
  </script>
</body>
</html>
