<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogCritique</title>
  <style>
    :root {
      --bg: #f4f2ec;
      --paper: #fffcf6;
      --ink: #1c1917;
      --muted: #6f6a64;
      --faint: #9a948c;
      --line: #e4dfd6;
      --line-2: #eeeae2;
      --hover: #f3efe6;
      --select: #ebe4d4;
      --accent: #1c1917;
      --v: #57534e;
      --d: #1d4ed8;
      --i: #3f6212;
      --w: #a16207;
      --e: #b42318;
      --wtf: #6d28d9;
      --print: #9a3412;
      --loop: #9f1239;
      --observer: #0e7490;
      --listener: #3f6212;
      --hot: #9a3412;
      --sans: ui-sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }

    header.app {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      font: 600 11px/1 var(--sans);
      letter-spacing: 0.02em;
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: min(72vw, 720px); }
    .copy-ai {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .copy-ai:hover { background: #44403c; border-color: #44403c; }

    .metrics {
      display: flex;
      gap: 0;
      padding: 0 22px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .stat {
      padding: 12px 20px 12px 0;
      margin-right: 20px;
      border-right: 1px solid var(--line);
    }
    .stat:last-child { border-right: 0; }
    .stat b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; color: var(--muted); }
    .stat.primary { color: inherit; }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 106px);
    }
    aside {
      background: var(--paper);
      border-right: 1px solid var(--line);
      padding: 16px 14px 28px;
      overflow: auto;
    }
    .aside-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .aside-head h2 { margin: 0; font-size: 12px; font-weight: 600; }
    .aside-head span { font-size: 11px; color: var(--faint); }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      padding: 7px 9px;
      border-radius: 0;
    }
    .search:focus { outline: 1px solid var(--ink); border-color: var(--ink); }

    .file-list { margin-top: 12px; display: flex; flex-direction: column; }
    .file-btn, .all-btn {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 6px 8px;
      align-items: center;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line-2);
      background: transparent;
      padding: 8px 4px;
    }
    .all-btn { grid-template-columns: 1fr auto; font-weight: 600; }
    .file-btn:hover, .all-btn:hover { background: var(--hover); }
    .file-btn.active, .all-btn.active { background: var(--select); }
    .rank { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .file-name { font-weight: 500; font-size: 13px; }
    .file-path { display: block; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
    .bar { grid-column: 2 / -1; height: 2px; background: var(--line-2); }
    .bar > i { display: block; height: 100%; background: var(--ink); opacity: 0.45; }

    main { padding: 16px 20px 48px; }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .panel h2 { display: none; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-label { width: 72px; flex: 0 0 72px; font-size: 11px; color: var(--muted); }
    .chip {
      border: 1px solid var(--line);
      background: transparent;
      padding: 3px 8px;
      font-size: 12px;
    }
    .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .ghost {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--line);
      padding: 4px 9px;
      font-size: 12px;
      color: var(--muted);
    }
    .ghost:hover { border-color: var(--ink); color: var(--ink); }

    .result-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .pager { display: flex; gap: 6px; }
    .pager button {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 4px 10px;
      font-size: 12px;
    }

    .file-group {
      background: var(--paper);
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .file-group > h3 {
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .file-group > h3 small { font-weight: 400; color: var(--faint); font-size: 12px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line-2); }
    th { font-size: 11px; font-weight: 500; color: var(--faint); background: #faf7f0; }
    tr.call { cursor: pointer; }
    tr.call:hover td { background: var(--hover); }
    tr.call.open td { background: var(--select); }
    .lvl {
      display: inline-block;
      min-width: 52px;
      text-align: center;
      border: 1px solid currentColor;
      background: transparent;
      font: 500 10px/1.6 var(--mono);
      letter-spacing: 0.04em;
    }
    .lvl.v { color: var(--v); } .lvl.d { color: var(--d); }
    .lvl.i { color: var(--i); } .lvl.w { color: var(--w); }
    .lvl.e { color: var(--e); } .lvl.wtf { color: var(--wtf); }
    .lvl.println, .lvl.print { color: var(--print); }
    .score { font-variant-numeric: tabular-nums; font-weight: 500; }
    .where { font-weight: 500; }
    .snippet { font-family: var(--mono); font-size: 12px; }
    .why { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .badge {
      display: inline-block;
      font-size: 10px;
      border: 1px solid var(--line);
      padding: 0 6px;
      margin: 4px 4px 0 0;
      color: var(--muted);
    }
    .badge.loop { color: var(--loop); border-color: #f0c8d4; }
    .badge.observer { color: var(--observer); border-color: #b8e6ee; }
    .badge.listener { color: var(--listener); border-color: #cfe0b8; }
    .badge.hot_path { color: var(--hot); border-color: #f3d0c0; }

    .detail {
      margin: 0 12px 12px;
      padding: 0;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--ink);
      font: 12px/1.5 var(--sans);
      white-space: normal;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .detail-grid dt { color: var(--faint); }
    .detail-grid dd { margin: 0; font-family: var(--mono); }
    .source { font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 8px 0; }
    .src-line { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 0 14px; }
    .src-line .ln { color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; user-select: none; }
    .src-line code { font: inherit; white-space: pre-wrap; }
    .src-line.is-hit { background: #f4e3c2; }

    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--faint);
      background: var(--paper);
      border: 1px dashed var(--line);
    }
    .errors { margin-top: 14px; color: var(--e); font-size: 12px; }
    .line { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 280px; }
    }
  </style>
</head>
<body>
  <header class="app">
    <div class="brand">
      <span class="mark" aria-hidden="true">LC</span>
      <div>
        <h1>LogCritique</h1>
        <p class="sub" id="subtitle">Offline review of Android log calls</p>
      </div>
    </div>
    <button type="button" class="copy-ai" id="copyAi">Export JSON</button>
  </header>
  <div class="metrics" id="kpis"></div>
  <div class="layout">
    <aside>
      <div class="aside-head">
        <h2>Files</h2>
        <span>most → least</span>
      </div>
      <input class="search" id="fileSearch" placeholder="Filter files" aria-label="Filter file names">
      <div class="file-list" id="tree"></div>
    </aside>
    <main>
      <section class="panel">
        <h2>Filters</h2>
        <div class="filter-row">
          <span class="filter-label">Search</span>
          <input class="search" id="findingSearch" placeholder="Function, snippet, path" aria-label="Search findings" style="max-width:420px">
        </div>
        <div class="filter-row" id="levelFilters">
          <span class="filter-label">Level</span>
        </div>
        <div class="filter-row" id="contextFilters">
          <span class="filter-label">Context</span>
        </div>
        <div class="filter-row">
          <span class="filter-label">Focus</span>
          <button type="button" class="chip" id="chattyBtn">Hot paths</button>
          <button type="button" class="ghost" id="clearBtn">Reset</button>
        </div>
      </section>
      <div class="result-meta">
        <div id="pageInfo"></div>
        <div class="pager">
          <button id="prevPage" type="button">Previous</button>
          <button id="nextPage" type="button">Next</button>
        </div>
      </div>
      <div id="groups"></div>
      <div class="empty" id="empty" hidden>No log calls match the current filters.</div>
      <div class="errors" id="errors"></div>
    </main>
  </div>
  <script id="log-analyzer-data" type="application/json"><<<LOG_ANALYZER_JSON>>></script>
  <script>
    const DATA = JSON.parse(document.getElementById("log-analyzer-data").textContent);
    const PAGE = 60;
    const state = {
      levels: new Set(),
      contexts: new Set(),
      chattyOnly: false,
      file: "",
      fileQuery: "",
      query: "",
      page: 0,
      open: null,
    };
    const levelOrder = ["v","d","i","w","e","wtf","println","print"];
    const contextOrder = ["loop","observer","listener","hot_path"];
    const contextLabel = { loop: "Loop", observer: "Observer", listener: "Listener", hot_path: "Hot path" };
    const fileCount = Object.fromEntries(DATA.files.map((f) => [f.path, f.count]));
    const maxCount = Math.max(1, ...DATA.files.map((f) => f.count));

    function $(id) { return document.getElementById(id); }

    function renderKpis() {
      const s = DATA.stats;
      const items = [
        ["Calls", s.findings, true],
        ["Files", s.files_with_findings, true],
        ["Hot paths", s.high_freq, true],
        ["Scanned", s.files_scanned, false],
      ];
      $("kpis").innerHTML = items.map(([label, value, primary]) =>
        `<div class="stat ${primary ? "primary" : ""}"><b>${value}</b><span>${label}</span></div>`
      ).join("");
      const parsers = s.by_parser || {};
      const parserBits = ["tree-sitter", "javalang", "regex"]
        .filter((name) => parsers[name])
        .map((name) => `${name} ${parsers[name]}`);
      $("subtitle").textContent = `${DATA.root}  ·  ${DATA.generated_at}`
        + (parserBits.length ? `  ·  ${parserBits.join(" · ")}` : "");
    }

    function rankedFiles() {
      const q = state.fileQuery.toLowerCase();
      return DATA.files.filter((f) => !q || f.path.toLowerCase().includes(q));
    }

    function renderTree() {
      const files = rankedFiles();
      const allCount = DATA.stats.findings;
      let html = `<button class="all-btn ${state.file ? "" : "active"}" data-file="">
        <span>All files</span><span class="file-count">${allCount}</span></button>`;
      files.forEach((file, index) => {
        const active = state.file === file.path ? "active" : "";
        const width = Math.max(8, Math.round((file.count / maxCount) * 100));
        html += `<button class="file-btn ${active}" data-file="${escapeAttr(file.path)}">
          <span class="rank">${index + 1}</span>
          <span><span class="file-name">${escapeHtml(file.path.split("/").pop())}</span>
            <span class="file-path">${escapeHtml(file.path)}</span></span>
          <span class="file-count">${file.count}</span>
          <span class="bar"><i style="width:${width}%"></i></span>
        </button>`;
      });
      $("tree").innerHTML = html;
      $("tree").querySelectorAll("[data-file]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.file = btn.getAttribute("data-file") || "";
          state.page = 0;
          renderTree();
          renderRows();
        });
      });
    }

    function renderFilters() {
      $("levelFilters").innerHTML = `<span class="filter-label">Level</span>` +
        levelOrder.filter((level) => DATA.stats.by_level[level]).map((level) =>
          `<button type="button" class="chip ${level}" data-kind="level" data-value="${level}">${level.toUpperCase()} ${DATA.stats.by_level[level]}</button>`
        ).join("");
      $("contextFilters").innerHTML = `<span class="filter-label">Context</span>` +
        contextOrder.map((ctx) =>
          `<button type="button" class="chip ${ctx}" data-kind="context" data-value="${ctx}">${contextLabel[ctx]} ${DATA.stats.by_context[ctx] || 0}</button>`
        ).join("");
    }

    function toggleSet(set, value) {
      if (set.has(value)) set.delete(value);
      else set.add(value);
    }

    function syncChips() {
      document.querySelectorAll(".chip[data-kind]").forEach((btn) => {
        const on = btn.dataset.kind === "level"
          ? state.levels.has(btn.dataset.value)
          : state.contexts.has(btn.dataset.value);
        btn.classList.toggle("on", on);
      });
      $("chattyBtn").classList.toggle("on", state.chattyOnly);
    }

    function filtered() {
      return DATA.findings.filter((f) => {
        if (state.file && f.file !== state.file) return false;
        if (state.levels.size && !state.levels.has(f.level)) return false;
        if (state.contexts.size && !f.contexts.some((c) => state.contexts.has(c))) return false;
        if (state.chattyOnly && !(f.contexts.length || f.chatty_score >= 6)) return false;
        if (state.query) {
          const blob = `${f.file} ${f.snippet} ${f.enclosing_function} ${f.enclosing_class} ${f.why} ${f.api}`.toLowerCase();
          if (!blob.includes(state.query.toLowerCase())) return false;
        }
        return true;
      }).sort((a, b) => {
        const ca = fileCount[a.file] || 0;
        const cb = fileCount[b.file] || 0;
        if (cb !== ca) return cb - ca;
        if (b.chatty_score !== a.chatty_score) return b.chatty_score - a.chatty_score;
        return a.line - b.line;
      });
    }

    function badges(finding) {
      return (finding.contexts || []).map((c) => `<span class="badge ${c}">${contextLabel[c] || c}</span>`).join("");
    }

    function renderSource(windowText) {
      if (!windowText) return "";
      return `<div class="source">${windowText.split("\n").map((line) => {
        const hit = line.startsWith(">");
        const rest = line.replace(/^[> ]/, "");
        const match = rest.match(/^\s*(\d+)\|(.*)$/);
        if (!match) {
          return `<div class="src-line${hit ? " is-hit" : ""}"><span class="ln"></span><code>${escapeHtml(line)}</code></div>`;
        }
        return `<div class="src-line${hit ? " is-hit" : ""}"><span class="ln">${escapeHtml(match[1])}</span><code>${escapeHtml(match[2])}</code></div>`;
      }).join("")}</div>`;
    }

    function renderDetail(f) {
      const rows = [
        ["Call", `${f.api}.${f.method}`],
        ["Receiver", f.receiver || "—"],
        ["Location", `${f.file}:${f.line}:${f.column}`],
        ["Function", `${f.enclosing_class || "—"}.${f.enclosing_function || "—"}`],
        ["Parsers", (f.parse_sources || []).join(", ") || "—"],
        ["Evidence", (f.context_reasons || []).join(" · ") || "Not inside a loop, observer, or listener"],
      ];
      const grid = rows.map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join("");
      return `<div class="detail"><dl class="detail-grid">${grid}</dl>${renderSource(f.source_window || f.snippet)}</div>`;
    }

    function renderRows() {
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / PAGE));
      if (state.page >= pages) state.page = pages - 1;
      const slice = rows.slice(state.page * PAGE, (state.page + 1) * PAGE);
      $("empty").hidden = rows.length > 0;
      const groups = [];
      let current = null;
      slice.forEach((f) => {
        if (!current || current.path !== f.file) {
          current = { path: f.file, items: [] };
          groups.push(current);
        }
        current.items.push(f);
      });
      $("groups").innerHTML = groups.map((group) => {
        const name = group.path.split("/").pop();
        const total = fileCount[group.path] || group.items.length;
        const body = group.items.map((f) => {
          const key = `${f.file}:${f.line}:${f.column}:${f.method}`;
          const open = state.open === key;
          return `<tr class="call ${open ? "open" : ""}" data-key="${escapeAttr(key)}">
            <td class="score">${f.chatty_score}</td>
            <td><span class="lvl ${f.level}">${f.level.toUpperCase()}</span></td>
            <td class="line">L${f.line}</td>
            <td><div class="where">${escapeHtml(f.enclosing_class || "—")}${f.enclosing_function ? "." + escapeHtml(f.enclosing_function) : ""}</div>${badges(f)}</td>
            <td><div class="snippet">${escapeHtml(f.snippet)}</div><div class="why">${escapeHtml(f.why)}</div></td>
          </tr>${open ? `<tr><td colspan="5">${renderDetail(f)}</td></tr>` : ""}`;
        }).join("");
        return `<section class="file-group">
          <h3>${escapeHtml(name)} <small>${escapeHtml(group.path)} · ${total} in file</small></h3>
          <table>
            <thead><tr><th>Score</th><th>Level</th><th>Line</th><th>Where</th><th>Call</th></tr></thead>
            <tbody>${body}</tbody>
          </table>
        </section>`;
      }).join("");
      $("groups").querySelectorAll("tr.call").forEach((tr) => {
        tr.addEventListener("click", () => {
          state.open = state.open === tr.dataset.key ? null : tr.dataset.key;
          renderRows();
        });
      });
      $("pageInfo").textContent = `${rows.length} matching calls · page ${state.page + 1} of ${pages}`;
      $("prevPage").disabled = state.page <= 0;
      $("nextPage").disabled = state.page >= pages - 1;
      if (DATA.errors && DATA.errors.length) {
        $("errors").innerHTML = DATA.errors.map((e) => `${e.file}: ${e.error}`).join("<br>");
      }
      syncChips();
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, "&quot;");
    }

    function applyFilterChange() {
      state.page = 0;
      renderRows();
    }

    $("levelFilters").addEventListener("click", (ev) => {
      const btn = ev.target.closest(".chip");
      if (!btn) return;
      toggleSet(state.levels, btn.dataset.value);
      applyFilterChange();
    });
    $("contextFilters").addEventListener("click", (ev) => {
      const btn = ev.target.closest(".chip");
      if (!btn) return;
      toggleSet(state.contexts, btn.dataset.value);
      applyFilterChange();
    });
    $("chattyBtn").addEventListener("click", () => {
      state.chattyOnly = !state.chattyOnly;
      applyFilterChange();
    });
    $("clearBtn").addEventListener("click", () => {
      state.levels.clear();
      state.contexts.clear();
      state.chattyOnly = false;
      state.file = "";
      state.query = "";
      state.fileQuery = "";
      $("findingSearch").value = "";
      $("fileSearch").value = "";
      renderTree();
      applyFilterChange();
    });
    $("prevPage").addEventListener("click", () => { state.page -= 1; renderRows(); });
    $("nextPage").addEventListener("click", () => { state.page += 1; renderRows(); });
    $("fileSearch").addEventListener("input", (ev) => {
      state.fileQuery = ev.target.value;
      renderTree();
    });
    $("findingSearch").addEventListener("input", (ev) => {
      state.query = ev.target.value;
      applyFilterChange();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "/" && document.activeElement.tagName !== "INPUT") {
        ev.preventDefault();
        $("findingSearch").focus();
      }
      if (ev.key === "Escape") {
        state.open = null;
        renderRows();
      }
    });

    $("copyAi").addEventListener("click", async () => {
      const text = JSON.stringify(DATA, null, 2);
      try {
        await navigator.clipboard.writeText(text);
        $("copyAi").textContent = "Copied";
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        $("copyAi").textContent = "Copied";
      }
      setTimeout(() => { $("copyAi").textContent = "Export JSON"; }, 2000);
    });

    renderKpis();
    renderFilters();
    renderTree();
    renderRows();
  </script>
</body>
</html>
